# Wekelijks het knooppuntbestand opnieuw bouwen uit OpenStreetMap en de webapp uitrollen
# als het veranderd is. Zie tools/knooppunten/README.md.
#
# Secrets (Settings › Secrets and variables › Actions):
#   CLOUDFLARE_API_TOKEN   token met het sjabloon "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  het Cloudflare-account van de Worker
name: Knooppuntbestand

on:
  schedule:
    - cron: "0 3 * * 0" # zondag 03:00 UTC (04:00 in de winter, 05:00 in de zomer)
  workflow_dispatch:
    inputs:
      force:
        description: "Ook uitrollen als het bestand niet veranderd is"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: knooppunten
  cancel-in-progress: false

env:
  LIVE_URL: https://fietsknooppunten.deboskes.eu/data/knooppunten.json
  TARGET: worker/public/data/knooppunten.json

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: osmium installeren
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Tests van de bouwtool
        run: python3 -I -m unittest discover -s tools/knooppunten

      - name: Knooppuntbestand bouwen (NL + BE)
        run: |
          mkdir -p "$(dirname "$TARGET")"
          tools/knooppunten/build.sh "$RUNNER_TEMP/osm" "$TARGET"

      - name: Vergelijken met het live bestand
        id: compare
        run: |
          curl -sSfL "$LIVE_URL" -o "$RUNNER_TEMP/live.json" || echo '{}' > "$RUNNER_TEMP/live.json"
          # De datum verandert elke keer; vergelijk de rest.
          changed=$(python3 -I - "$TARGET" "$RUNNER_TEMP/live.json" <<'EOF'
          import json, sys
          def load(path):
              data = json.load(open(path))
              data.pop("date", None)
              return data
          print("true" if load(sys.argv[1]) != load(sys.argv[2]) else "false")
          EOF
          )
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Veranderd: $changed"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.compare.outputs.changed == 'true' || inputs.force
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Testen en uitrollen
        if: steps.compare.outputs.changed == 'true' || inputs.force
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm test
          npx wrangler deploy
